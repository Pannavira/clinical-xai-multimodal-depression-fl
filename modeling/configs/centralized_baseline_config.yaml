# Centralized Multimodal Depression Baseline Configuration
project_name: FED-MIND
experiment_stage: centralized_multimodal_baseline

data:
  workspace_dir: "."
  train_index: "federated_learning_output/global_train_index.csv"
  validation_index: "federated_learning_output/global_validation_index.csv"
  test_index: "federated_learning_output/global_test_index.csv"
  detailed_labels_path: "data/detailed_lables.csv"
  preprocessing_output_dir: "preprocessing_output"
  visual_features_csv: "preprocessing_output/visual/visual_features.csv"
  visual_sequence_npy: "preprocessing_output/visual/visual_features_sequence.npy"
  visual_sequence_index_csv: "preprocessing_output/visual/visual_features_sequence_index.csv"
  output_dir: "modeling_output"

columns:
  id_column: "participant_id"
  raw_label_column: "depression_label"
  binary_label_column: "Depression_label"
  text_feature_column: "text_feature_path"
  audio_feature_column: "audio_feature_path"
  visual_feature_column: "visual_feature_path"

features:
  text_dim: 768
  audio_dim: 128
  visual_dim: 31
  visual_source: "sequence_pooled" # options: "tabular" (178-d from visual_features.csv) or "sequence_pooled" (31-d mean pooled from visual_features_sequence.npy)

model:
  text_encoder: "mlp"
  audio_encoder: "mlp"
  visual_encoder: "mlp"
  fusion_strategy: "late_fusion" # options: "late_fusion", "text_only", "audio_only", "visual_only", "text_audio", "text_visual", "audio_visual"
  hidden_dim: 128
  fusion_dim: 128
  dropout: 0.4   # EXP037 optimal

training:
  batch_size: 8       # EXP037 optimal
  epochs: 50
  learning_rate: 0.0001  # EXP037 optimal
  optimizer: "adam"
  weight_decay: 0.003    # EXP037 optimal (L2=0.003)
  loss_function: "binary_cross_entropy"
  early_stopping: true
  patience: 10      # More patience for full 50-epoch final training
  random_seed: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
  threshold: 0.5

advanced_training:
  # --- Loss Function (EXP037: FocalLoss=True) ---
  use_focal_loss: true          # true=FocalLoss, false=BCEWithLogitsLoss
  focal_alpha: 0.75             # Weight for positive class in FocalLoss (>0.5 boosts recall)
  focal_gamma: 2.0              # Focusing parameter (2.0 = standard)

  # --- Data Augmentation (EXP037: noise=0.01 + ModalityDropout=0.15) ---
  augment_noise_std: 0.01       # Gaussian noise std-dev injected during training
  modality_dropout_prob: 0.15   # Prob to zero-out a modality during training to prevent over-reliance

  # --- Learning Rate Scheduler (EXP037: LRSched=False) ---
  use_lr_scheduler: false       # ReduceLROnPlateau scheduler (off per EXP037)
  lr_scheduler_patience: 3      # Epochs to wait before reducing LR
  lr_scheduler_factor: 0.5      # LR multiplier on plateau

  # --- Fusion Architecture (Cross-Modal Attention Upgrade) ---
  fusion_architecture: "cross_attention" # Options: "concat", "gated", "cross_attention"
  use_gated_fusion: false                 # Handled via fusion_architecture

  # --- Threshold Strategy ---
  threshold_strategy: "recall_first"   # Maximize Recall s.t. Precision >= min_precision
  min_precision_constraint: 0.30       # Minimum acceptable Precision
  # Best threshold found in tuning: ~0.28 range (recall_first with FocalLoss)
